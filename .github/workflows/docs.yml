# Publishes the documentation (docs/ + mkdocs.yml) as a GitHub Pages website.
# Runs on every push to main that touches the docs, and can be started by hand
# (GitHub -> Actions -> "Documentation" -> Run workflow).
# One-time setup: GitHub repo -> Settings -> Pages -> Source: "GitHub Actions".
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # allowed to publish to GitHub Pages
  id-token: write   # proves to Pages that this workflow is allowed to deploy

# Only one deployment at a time; a newer push replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same version as the Docker image used by tools/docs.ps1
      - run: pip install "mkdocs-material==9.5.50"
      # --strict: a broken link fails the build instead of publishing it
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
