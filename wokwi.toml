# Wokwi simulator config (VS Code extension "Wokwi Simulator").
# 1. Build the "wokwi" environment in PlatformIO.
# 2. F1 -> "Wokwi: Start Simulator".
# 3. Open http://localhost:8180 for the web UI (login: admin / CC_DEFAULT_WEB_PASSWORD from .env).
[wokwi]
version = 1
firmware = ".pio/build/wokwi/firmware.bin"
elf = ".pio/build/wokwi/firmware.elf"

[[net.forward]]
from = "localhost:8180"
to = "target:80"
