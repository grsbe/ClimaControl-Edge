# Telegraf: subscribes to the controller's MQTT messages and writes them into InfluxDB.
# Secrets come from environment variables (server\.env via docker-compose.yml).

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "wildnis"
  bucket = "climacontrol"

# Fused values: wildnis/<device>/signal/<group.quantity>, payload e.g. "87.4" (or "null" if invalid,
# which is skipped). Stored as measurement "signal", tags device + signal, field "value".
[[inputs.mqtt_consumer]]
  servers = ["tcp://mqtt:1883"]
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  client_id = "telegraf-signals"
  topics = ["wildnis/+/signal/+"]
  topic_tag = ""
  data_format = "value"
  data_type = "float"
  name_override = "signal"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "wildnis/+/signal/+"
    tags = "_/device/_/signal"

# online / offline (offline is the controller's last will)
[[inputs.mqtt_consumer]]
  servers = ["tcp://mqtt:1883"]
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  client_id = "telegraf-availability"
  topics = ["wildnis/+/availability"]
  topic_tag = ""
  data_format = "value"
  data_type = "string"
  name_override = "availability"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "wildnis/+/availability"
    tags = "_/device/_"

# Change log: one message per change (who, what, through which channel). Stored as measurement
# "event", tags device/action/source/user; fields seq, detail, client.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mqtt:1883"]
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  client_id = "telegraf-events"
  topics = ["wildnis/+/event"]
  topic_tag = ""
  qos = 1
  data_format = "json_v2"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "wildnis/+/event"
    tags = "_/device/_"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "event"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "action"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "source"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "user"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "seq"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "detail"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "client"
      type = "string"

# Full status JSON every 10 s: outputs, individual sensors and system health.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mqtt:1883"]
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  client_id = "telegraf-status"
  topics = ["wildnis/+/status"]
  topic_tag = ""
  data_format = "json_v2"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "wildnis/+/status"
    tags = "_/device/_"

  # one point per output: tag name; fields level, on, mode, reason
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "output"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "outputs"
      tags = ["name"]
      included_keys = ["name", "level", "on", "mode", "reason"]
      [inputs.mqtt_consumer.json_v2.object.fields]
        level = "float"
        on = "bool"

  # one point per physical sensor: tags id, type, group; fields ok, failures, values_<quantity>
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "sensor"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "sensors"
      tags = ["id", "type", "group"]
      excluded_keys = ["ageS"]
      [inputs.mqtt_consumer.json_v2.object.fields]
        ok = "bool"
        failures = "int"

  # one point per active alarm: tag code (e.g. limit.chamber.humidity.low); fields critical, message.
  # Used by the alert rules; an empty alarm list writes nothing.
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "alarm"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "alarms"
      tags = ["code"]
      [inputs.mqtt_consumer.json_v2.object.fields]
        critical = "bool"
        message = "string"

  # controller health
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "system"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "uptimeS"
      rename = "uptime_s"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "system.freeHeap"
      rename = "free_heap"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "system.minFreeHeap"
      rename = "min_free_heap"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "system.wifi.sta.rssi"
      rename = "wifi_rssi"
      type = "int"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "alarms.#"
      rename = "alarms"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "alarms.#(critical==true)#|#"
      rename = "critical_alarms"
      type = "int"
