; ClimaControl firmware - PlatformIO project
;
;   pio run -e esp32s3 -t upload       build + flash the ESP32-S3-DevKitC-1 (default board)
;   pio run -e esp32s3_sim -t upload   same, but with simulated sensors (bare board on the desk)
;   pio run -e esp32dev -t upload      classic ESP32 (DevKitC-32E), also supported
;   pio device monitor                 serial console
;   pio test -e native                 run the unit tests on the PC (no ESP needed)

[platformio]
default_envs = esp32s3

[env]
lib_deps =
    bblanchon/ArduinoJson@^7.2.1

[esp32_common]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; two 1.9 MB app slots so over-the-air updates fit, small LittleFS for the config file
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINOJSON_ENABLE_STD_STRING=1
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit BME680 Library@^2.0.4

; ESP32-S3-DevKitC-1 and clones (N8R8, N16R8, ...). Flash through the port labelled UART or COM.
[env:esp32s3]
extends = esp32_common
board = esp32-s3-devkitc-1

; Same board, sensors replaced by a simple room simulation (for testing without hardware)
[env:esp32s3_sim]
extends = env:esp32s3
build_flags =
    ${esp32_common.build_flags}
    -DCC_FORCE_SIMULATION=1

; Runs in the Wokwi simulator (VS Code extension, see wokwi.toml): simulated sensors, joins the
; simulator's "Wokwi-GUEST" network instead of opening an access point.
[env:wokwi]
extends = env:esp32s3
build_flags =
    ${esp32_common.build_flags}
    -DCC_FORCE_SIMULATION=1
    -DCC_WOKWI=1

; Classic ESP32: Espressif ESP32-DevKitC-32E / -32UE (ESP32-WROOM-32E, 4 MB flash)
[env:esp32dev]
extends = esp32_common
board = esp32dev

[env:esp32dev_sim]
extends = env:esp32dev
build_flags =
    ${esp32_common.build_flags}
    -DCC_FORCE_SIMULATION=1

; Unit tests of lib/core on the PC
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -DARDUINOJSON_ENABLE_STD_STRING=1
    -Wall
